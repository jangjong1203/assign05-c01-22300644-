<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let movies = [
            {
                id: 1,
                title: "제목",
                director: "감독",
                genre: "장르",
                year: 2026,
                rating: 10.0
            }, {
                id: 2,
                title: "기생충",
                director: "봉준호",
                genre: "스릴러",
                year: 2019,
                rating: 9.5
            }, {
                id: 3,
                title: "인터스텔라",
                director: "크리스토퍼 놀란",
                genre: "SF",
                year: 2014,
                rating: 8.8
            }
        ]

        function editButton(id) {
            movies.forEach(function (movie) {
                if (movie.id==id) {
                    id = movie.id;
                    title.value = movie.title;
                    director.value = movie.director;
                    genre.value = movie.genre;
                    year.value = movie.year;
                    rating.value = movie.rating;
                }
            })
        }


        function render() {
            const movielist = document.querySelector("#mlist");
            movielist.innerHTML = '';
            movies.forEach(function (movie) {
                const tr = document.createElement("tr");
                movielist.appendChild(tr);

                let td1 = document.createElement("td");
                let td2 = document.createElement("td");
                let td3 = document.createElement("td");
                let td4 = document.createElement("td");
                let td5 = document.createElement("td");
                let td6 = document.createElement("td");

                td1.textContent = movie.id;
                td2.textContent = movie.title;
                td3.textContent = movie.genre
                td4.textContent = movie.director;
                td5.textContent = movie.year;
                td6.textContent = movie.rating;

                tr.appendChild(td1);
                tr.appendChild(td2);
                tr.appendChild(td3);
                tr.appendChild(td4);
                tr.appendChild(td5);
                tr.appendChild(td6);


                const editBtn = document.createElement("button");
                editBtn.textContent = "수정";
                tr.appendChild(editBtn);
                editBtn.addEventListener("click", editButton(movie.id));

                const DelBtn = document.createElement("button");
                DelBtn.textContent = "삭제";
                tr.appendChild(DelBtn);


            })
        }
        window.addEventListener("load", function () {
            const title = document.querySelector("#title");
            const director = document.querySelector("#director");
            const genre = document.querySelector("#genre");
            const year = document.querySelector("#year");
            const rating = document.querySelector("#rating");
            const add = document.querySelector("#add");
            render();
            add.addEventListener("click", function (e) {
                e.preventDefault();
                if (title.value == '') {
                    alert("제목을 입력하시오!");
                    title.focus();
                    e.preventDefault();
                    return;
                }
                if (director.value == '') {
                    alert("감독을 입력하시오!");
                    director.focus();
                    e.preventDefault();
                    return;
                }
                if (genre.value == '') {
                    alert("장르을 입력하시오!");
                    genre.focus();
                    e.preventDefault();
                    return;
                }
                if (year.value == '') {
                    alert("개봉연도을 입력하시오!");
                    year.focus();
                    e.preventDefault();
                    return;
                }
                if (rating.value == '') {
                    alert("평점을 입력하시오!");
                    rating.focus();
                    e.preventDefault();
                    return;
                }

                const ID = movies.length + 1;
                let newmovie = {
                    id: ID,
                    title: title.value,
                    director: director.value,
                    genre: genre.value,
                    year: year.value,
                    rating: rating.value,
                }
                movies.push(newmovie);
                render();
                title.value = '';
                director.value = '';
                genre.value = '';
                year.value = '';
                rating.value = '';
            })

        })


    </script>
</head>

<body>
    <form>
        제목:
        <input type="text" id="title">
        <br>
        감독:
        <input type="text" id="director">
        <br>
        장르:
        <input type="text" id="genre">
        <br>
        개봉연도:
        <input type="text" id="year">
        <br>
        평점:
        <input type="text" id="rating">
        <br>
        <button id="add">추가</button>
    </form>
    <hr>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>제목</th>
                <th>장르</th>
                <th>감독</th>
                <th>개봉연도</th>
                <th>평점</th>
        </thead>
        <tbody id="mlist">

        </tbody>
    </table>



</body>

</html>
