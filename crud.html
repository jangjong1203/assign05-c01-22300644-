<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: powderblue;
            max-width: 800px;
            min-width:400px;
            margin:20px 24% 0 24%;

        }

        #inputsection {
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        #inputsection input {
            width: 100%;
            background-color: white;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 15px;

        }

        #add {
            border-radius: 5px;
            width: 33%;
            margin-left: 33%;
            background-color: rgb(140, 213, 242);

        }

        #add:hover {
            background-color: rgb(72, 148, 178);
        }

        table {
            border-radius: 10px;
            width: 100%;
            background-color: azure;
            text-align: center;
        }


        th,
        td {
            padding: 5px;
        }

        th {
            background-color: #a3afbb;
            font-weight: bold;
        }
        tr button{
            background-color:rgb(140, 213, 242);
        }   
        tr button:hover{
            background-color: rgb(72, 148, 178);
        }   
    </style>
    <script>
        let movies = [
            {
                id: 1,
                title: "제목",
                director: "감독",
                genre: "장르",
                year: 2026,
                rating: 10.0
            }, {
                id: 2,
                title: "기생충",
                director: "봉준호",
                genre: "스릴러",
                year: 2019,
                rating: 9.5
            }, {
                id: 3,
                title: "인터스텔라",
                director: "크리스토퍼 놀란",
                genre: "SF",
                year: 2014,
                rating: 8.8
            }
        ]


        let editId = 0;
        let nextId = 4;

        function render() {
            const movielist = document.querySelector("#mlist");
            movielist.innerHTML = '';
            movies.forEach(function (movie) {
                const tr = document.createElement("tr");
                movielist.appendChild(tr);

                let td1 = document.createElement("td");
                let td2 = document.createElement("td");
                let td3 = document.createElement("td");
                let td4 = document.createElement("td");
                let td5 = document.createElement("td");
                let td6 = document.createElement("td");

                td1.textContent = movie.id;
                td2.textContent = movie.title;
                td3.textContent = movie.genre
                td4.textContent = movie.director;
                td5.textContent = movie.year;
                td6.textContent = movie.rating;

                tr.appendChild(td1);
                tr.appendChild(td2);
                tr.appendChild(td3);
                tr.appendChild(td4);
                tr.appendChild(td5);
                tr.appendChild(td6);

                const editBtn = document.createElement("button");
                editBtn.textContent = "수정";
                tr.appendChild(editBtn);
                editBtn.addEventListener("click", function () {
                    const title = document.querySelector("#title");
                    title.value = movie.title;
                    const director = document.querySelector("#director");
                    director.value = movie.director;
                    const genre = document.querySelector("#genre");
                    genre.value = movie.genre;
                    const year = document.querySelector("#year")
                    year.value = movie.year;
                    const rating = document.querySelector("#rating")
                    rating.value = movie.rating;
                    const add = document.querySelector("#add");
                    add.textContent = "저장";
                    editId = movie.id;
                });

                const delBtn = document.createElement("button");
                delBtn.textContent = "삭제";
                tr.appendChild(delBtn);
                delBtn.addEventListener("click", function () {
                    if (confirm("삭제하시겠습니까?")) {
                        let targetIndex = movies.findIndex(function (m) {
                            return m.id === movie.id;
                        });
                        movies.splice(targetIndex, 1);

                        if (editId === movie.id) {
                            editId = 0;
                            add.textContent = "추가";
                            title.value = '';
                            director.value = '';
                            genre.value = '';
                            year.value = '';
                            rating.value = '';
                        }
                        render();
                    }
                });
            })
        }
        window.addEventListener("load", function () {
            const title = document.querySelector("#title");
            const director = document.querySelector("#director");
            const genre = document.querySelector("#genre");
            const year = document.querySelector("#year");
            const rating = document.querySelector("#rating");
            const add = document.querySelector("#add");
            render();
            add.addEventListener("click", function (e) {
                e.preventDefault();
                if (title.value == '') {
                    alert("제목을 입력하시오!");
                    title.focus();
                    e.preventDefault();
                    return;
                }
                if (director.value == '') {
                    alert("감독을 입력하시오!");
                    director.focus();
                    e.preventDefault();
                    return;
                }
                if (genre.value == '') {
                    alert("장르을 입력하시오!");
                    genre.focus();
                    e.preventDefault();
                    return;
                }
                if (year.value == '') {
                    alert("개봉연도을 입력하시오!");
                    year.focus();
                    e.preventDefault();
                    return;
                } else if (isNaN(year.value)) {
                    alert("개봉연도는 숫자로 입력하시오!");
                    year.focus();
                    e.preventDefault();
                    return;
                }
                if (rating.value == '') {
                    alert("평점을 입력하시오!");
                    rating.focus();
                    e.preventDefault();
                    return;

                } else if (isNaN(rating.value)) {
                    alert("평점은 숫자로 입력하시오!");
                    rating.focus();
                    e.preventDefault();
                    return;
                } else if (rating.value < 0 || rating.value > 10) {
                    alert("평점은 0점에서 10점 사이로 입력하시오!");
                    rating.focus();
                    e.preventDefault();
                    return;
                }

                if (editId == 0) {
                    const ID = nextId++;
                    let newmovie = {
                        id: ID,
                        title: title.value,
                        director: director.value,
                        genre: genre.value,
                        year: year.value,
                        rating: rating.value,
                    }
                    movies.push(newmovie);
                } else {
                    movies.forEach(function (editMovie) {
                        if (editMovie.id == editId) {
                            editMovie.title = title.value;
                            editMovie.director = director.value;
                            editMovie.genre = genre.value;
                            editMovie.year = year.value;
                            editMovie.rating = rating.value;
                        }
                    });
                    add.textContent = "추가";
                    editId = 0;
                }

                render();
                title.value = '';
                director.value = '';
                genre.value = '';
                year.value = '';
                rating.value = '';
            })

        })


    </script>
</head>

<body>
    <form id="inputsection">
        제목:
        <input type="text" id="title">
        <br>
        감독:
        <input type="text" id="director">
        <br>
        장르:
        <input type="text" id="genre">
        <br>
        개봉연도:
        <input type="text" id="year">
        <br>
        평점:
        <input type="text" id="rating">
        <br>
        <button id="add">추가</button>
    </form>
    <hr>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>제목</th>
                <th>장르</th>
                <th>감독</th>
                <th>개봉연도</th>
                <th>평점</th>
                <th>내용변경</th>
        </thead>
        <tbody id="mlist">
        </tbody>
    </table>



</body>

</html>
